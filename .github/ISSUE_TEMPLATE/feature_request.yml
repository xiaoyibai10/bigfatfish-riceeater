name: ✨ 功能建议
description: 新成就、新玩法、新交互或文档改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！先说说你想解决什么问题，再说你希望怎么做。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      placeholder: 例如「每次刷新只能看到今日白饭，看不到本周趋势」
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
      placeholder: 例如「主界面加一个最近 7 天的小柱状图」
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 主界面
        - 成就系统
        - 排行榜
        - 设置
        - 定时刷新 / 角标
        - 后端 API
        - 文档 / 素材
        - 其它
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考
      placeholder: 你见过的类似实现、草图或链接

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 这个建议没有违反 DeepSeek 官方条款或本项目免责声明
          required: true
