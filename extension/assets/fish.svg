<?xml version="1.0" encoding="UTF-8"?>
<!--
  大肥鱼的白饭日记 · 手绘 SVG 吉祥物
  「大肥鱼端饭碗」：一只圆滚滚的 DeepSeek 蓝大肥鱼，端着满满一碗白饭。
  纯手写矢量图形，不引用任何外部图片或字体资源，可独立在浏览器打开。
  主色：DeepSeek 蓝 #4D6BFE；描边：#2C3FA8；米饭黄：#FFB84D 系。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-labelledby="fishTitle fishDesc">
  <title id="fishTitle">大肥鱼端饭碗</title>
  <desc id="fishDesc">一只圆滚滚的蓝色大肥鱼，双手端着满满一碗白米饭，碗里还插着两根筷子。</desc>

  <defs>
    <!-- 鱼身渐变：左上高光到右下深蓝 -->
    <linearGradient id="bodyGrad" x1="24%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#8FA5FF" />
      <stop offset="46%" stop-color="#5B78FF" />
      <stop offset="100%" stop-color="#3A54D4" />
    </linearGradient>
    <!-- 鱼肚渐变：更浅的蓝，增加圆滚滚的立体感 -->
    <linearGradient id="bellyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C9D6FF" stop-opacity="0.15" />
    </linearGradient>
    <!-- 尾鳍渐变 -->
    <linearGradient id="tailGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#4D6BFE" />
      <stop offset="100%" stop-color="#7E95FF" />
    </linearGradient>
    <!-- 白碗渐变 -->
    <linearGradient id="bowlGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="62%" stop-color="#F1F5FF" />
      <stop offset="100%" stop-color="#D7E1FA" />
    </linearGradient>
    <!-- 碗沿渐变 -->
    <linearGradient id="rimGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2EAFB" />
    </linearGradient>
    <!-- 米饭渐变：奶油白 -->
    <linearGradient id="riceGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FFF9EA" />
      <stop offset="100%" stop-color="#F2E4C2" />
    </linearGradient>
    <!-- 背景柔光 -->
    <radialGradient id="haloGrad" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#DCE7FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#EAF1FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#EAF1FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景柔光，让鱼更显圆润 -->
  <ellipse cx="120" cy="98" rx="112" ry="78" fill="url(#haloGrad)" />

  <!-- 飘着的小气泡 -->
  <g fill="#F4F8FF" stroke="#4D6BFE" stroke-width="2">
    <circle cx="201" cy="45" r="5" opacity="0.9" />
    <circle cx="214" cy="29" r="3.5" opacity="0.8" />
    <circle cx="192" cy="24" r="2.8" opacity="0.7" />
  </g>

  <!-- 尾鳍：左边的扇形尾巴 -->
  <path
    d="M 60 80 C 44 66 28 55 14 48 C 9 59 15 71 26 80 C 15 89 9 101 14 112 C 28 105 44 94 60 80 Z"
    fill="url(#tailGrad)"
    stroke="#2C3FA8"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- 背鳍：头顶的小圆鳍 -->
  <path
    d="M 76 38 C 86 19 108 17 122 33 C 107 29 91 32 76 38 Z"
    fill="url(#bodyGrad)"
    stroke="#2C3FA8"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- 鱼身体：一个大圆球 -->
  <ellipse
    cx="110"
    cy="80"
    rx="60"
    ry="50"
    fill="url(#bodyGrad)"
    stroke="#2C3FA8"
    stroke-width="3"
  />

  <!-- 鱼肚的浅色高光，增加「肥」的立体感 -->
  <ellipse cx="112" cy="110" rx="41" ry="17" fill="url(#bellyGrad)" />

  <!-- 身体左上角的一道奶油高光 -->
  <ellipse
    cx="87"
    cy="57"
    rx="21"
    ry="11"
    fill="#FFFFFF"
    opacity="0.38"
    transform="rotate(-20 87 57)"
  />

  <!-- 侧边小胸鳍 -->
  <path
    d="M 63 90 C 52 100 54 114 65 119 C 67 109 69 99 75 93 Z"
    fill="url(#tailGrad)"
    stroke="#2C3FA8"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- 眼睛：白眼球 + 深色瞳孔 + 高光，呆萌地看向饭碗 -->
  <g>
    <circle cx="137" cy="66" r="12.5" fill="#FFFFFF" stroke="#2C3FA8" stroke-width="2.5" />
    <circle cx="163" cy="71" r="10.5" fill="#FFFFFF" stroke="#2C3FA8" stroke-width="2.5" />
    <circle cx="142" cy="69" r="6" fill="#16224D" />
    <circle cx="167" cy="74" r="5" fill="#16224D" />
    <circle cx="140" cy="66" r="2.4" fill="#FFFFFF" opacity="0.95" />
    <circle cx="165" cy="71" r="2" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- 腮红 -->
  <ellipse cx="120" cy="92" rx="10" ry="6" fill="#FFA8C0" opacity="0.72" />
  <ellipse cx="164" cy="89" rx="5" ry="4" fill="#FFA8C0" opacity="0.66" />

  <!-- 嘴巴：圆圆的呆萌小嘴 + 一点小舌头 -->
  <ellipse cx="151" cy="96" rx="7" ry="5" fill="#7B3B50" stroke="#2C3FA8" stroke-width="2" />
  <ellipse cx="151" cy="99" rx="4" ry="2.4" fill="#FF8FA8" />

  <!-- 两条鱼鳍手臂，准备端碗 -->
  <g fill="none" stroke="#4D6BFE" stroke-width="10" stroke-linecap="round">
    <path d="M 78 112 C 82 134 92 140 108 140" />
    <path d="M 156 106 C 190 100 210 114 207 138" />
  </g>
  <g fill="none" stroke="#2C3FA8" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M 80 116 C 84 132 93 137 106 137" />
    <path d="M 158 109 C 190 104 205 116 204 135" />
  </g>

  <!-- 碗底投影 -->
  <ellipse cx="156" cy="176" rx="40" ry="5" fill="#4D6BFE" opacity="0.14" />

  <!-- 碗身 -->
  <path
    d="M 106 142 C 108 166 128 174 156 174 C 184 174 204 166 206 142 Z"
    fill="url(#bowlGrad)"
    stroke="#B9C6EA"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- 碗身高光 -->
  <path
    d="M 118 150 C 122 162 134 167 147 168"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.9"
  />
  <!-- 碗底的小圈足 -->
  <path
    d="M 145 172 L 167 172 L 163 178 L 149 178 Z"
    fill="#E6EDFF"
    stroke="#B9C6EA"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- 冒尖的白米饭 -->
  <path
    d="M 116 140 C 118 118 134 108 156 108 C 178 108 194 118 196 140 Z"
    fill="url(#riceGrad)"
    stroke="#E3D6B4"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- 米粒：一颗颗小椭圆 -->
  <g fill="#FFFDF3" stroke="#E9DDBD" stroke-width="1.2">
    <ellipse cx="128" cy="128" rx="5" ry="3" transform="rotate(-25 128 128)" />
    <ellipse cx="140" cy="120" rx="4.5" ry="2.8" transform="rotate(20 140 120)" />
    <ellipse cx="151" cy="132" rx="5" ry="3" transform="rotate(70 151 132)" />
    <ellipse cx="165" cy="120" rx="4.5" ry="2.8" transform="rotate(-15 165 120)" />
    <ellipse cx="179" cy="130" rx="5" ry="3" transform="rotate(35 179 130)" />
    <ellipse cx="156" cy="116" rx="4.5" ry="2.8" transform="rotate(10 156 116)" />
    <ellipse cx="132" cy="134" rx="4" ry="2.6" transform="rotate(55 132 134)" />
    <ellipse cx="186" cy="136" rx="4" ry="2.6" transform="rotate(-40 186 136)" />
  </g>

  <!-- 碗沿：盖住饭堆底部，形成「满满一碗」的感觉 -->
  <ellipse cx="156" cy="142" rx="52" ry="11" fill="url(#rimGrad)" stroke="#B9C6EA" stroke-width="2.5" />
  <ellipse cx="156" cy="142" rx="44" ry="7.5" fill="none" stroke="#E7EEFF" stroke-width="2" opacity="0.9" />

  <!-- 两根筷子，斜插在饭上 -->
  <g stroke-linecap="round">
    <line x1="171" y1="137" x2="222" y2="84" stroke="#C9863F" stroke-width="5.5" />
    <line x1="179" y1="141" x2="228" y2="90" stroke="#E0A45C" stroke-width="5.5" />
    <line x1="176" y1="131" x2="219" y2="87" stroke="#FFCE93" stroke-width="1.5" opacity="0.85" />
  </g>

  <!-- 两只圆圆的鱼鳍小手，扶着碗沿 -->
  <g fill="#5C77FF" stroke="#2C3FA8" stroke-width="2.5">
    <circle cx="108" cy="140" r="7.5" />
    <circle cx="207" cy="140" r="7.5" />
  </g>
  <path d="M 104 136 C 105 133 108 132 110 133" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.75" stroke-linecap="round" />
  <path d="M 204 136 C 205 133 208 132 210 133" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.75" stroke-linecap="round" />

  <!-- 头顶点缀：一小撮呆毛，增加萌感 -->
  <path
    d="M 104 31 C 104 22 110 18 116 20"
    fill="none"
    stroke="#2C3FA8"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
